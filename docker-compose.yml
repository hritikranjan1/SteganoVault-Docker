services:
  mysql:
    image: mysql:8.0
    container_name: steganovault-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steganovault}
      MYSQL_USER: ${MYSQL_USER:-stegano}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stegano123}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - stegano-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: steganovault-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword123}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stegano-net

  web:
    build: .
    container_name: steganovault-web
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me}
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-steganovault}
      MYSQL_USER: ${MYSQL_USER:-stegano}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-stegano123}
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
      - ./logs:/app/logs
      - ./tmp:/app/tmp
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - stegano-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: steganovault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      - stegano-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      retries: 3

volumes:
  mysql-data:
networks:
  stegano-net:
    driver: bridge
