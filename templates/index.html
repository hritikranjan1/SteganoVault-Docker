<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>SteganoVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav><select id="theme-toggle"></select><button id="authBtn">Login</button></nav>
    <div id="encode-decode" class="bg-[var(--card-bg)] p-6 rounded-lg">
        <h2>Encode / Decode</h2>
        <div id="drop-area" class="text-center">
            <p>📂 Drag & Drop your file here</p>
            <input type="file" id="fileInput" class="hidden">
            <button onclick="document.getElementById('fileInput').click()">Select File</button>
            <div id="fileName"></div>
        </div>
        <label>Enter Message:</label>
        <input type="text" id="messageInput">
        <label>Optional Password:</label>
        <input type="password" id="passwordInput">
        <button id="encodeBtnReady" class="bg-green-500">🔒 Encode</button>
        <button id="decodeBtnReady" class="bg-red-500">🔓 Decode</button>
        <div id="output"></div>
        <div id="decodedOutputContainer" class="hidden">
            <div id="decodedOutput"></div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
