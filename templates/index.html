<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>SteganoVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav><select id="theme-toggle"></select><button id="authBtn">Login</button></nav>
    <div id="encode-decode">
        <h2>Encode / Decode</h2>
        <div id="drop-area">
            <input type="file" id="fileInput" class="hidden">
            <button>Select File</button>
            <div id="fileName"></div>
        </div>
        <div id="previewBefore" class="hidden"><p>Before:</p><img class="max-h-40"></div>
        <div id="previewAfter" class="hidden"><p>After:</p><img class="max-h-40"></div>
        <input type="text" id="messageInput">
        <input type="password" id="passwordInput">
        <button id="encodeBtnReady">Encode</button>
        <button id="decodeBtnReady">Decode</button>
        <div id="output"></div>
        <div id="decodedOutputContainer" class="hidden"><div id="decodedOutput"></div></div>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
